services:
  - type: web
    name: geospatial-measurement-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GEO_DB_PATH
        value: data/geomeasure.db
      - key: GEO_MAX_UPLOAD_BYTES
        value: 52428800
      - key: GEO_ASYNC_WORKER_CONCURRENCY
        value: 4
